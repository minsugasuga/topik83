<style>
:root{--ink:#1e3a5f;--ink2:#2c5282;--rose:#c0392b;--gold:#d4a017;--teal:#1a7f6e;--lime:#2d7a47;--bg:#f0ece4;--card:#faf8f4;--bd:#ddd8cc;--tx:#1a1a2e;--soft:#6b6876;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans SC','Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom)+16px)}
button,input{font-family:inherit}

/* HEADER */
.hdr{background:var(--ink);padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));height:calc(56px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.logo{color:#fff;font-size:15px;font-weight:700}
.logo small{color:var(--gold);font-size:11px;font-weight:400;display:block}
.badge{background:var(--teal);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}

/* TABS */
.tabs{background:var(--ink);border-top:1px solid rgba(255,255,255,.1);display:flex;overflow-x:auto;scrollbar-width:none;padding:0 4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 12px;color:rgba(255,255,255,.4);font-size:12px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s;user-select:none}
.tab.on{color:#fff;border-bottom-color:var(--gold)}

/* MAIN */
.main{padding:14px;max-width:760px;margin:0 auto}

/* PILLS */
.pills{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.pill{background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:8px 12px;flex:1;min-width:70px;text-align:center}
.pill .n{font-size:20px;font-weight:700;color:var(--ink)}
.pill .l{font-size:10px;color:var(--soft);margin-top:1px}

/* PROGRESS */
.pbar{background:var(--bd);border-radius:4px;height:5px;margin-bottom:6px}
.pfill{background:var(--rose);height:5px;border-radius:4px;transition:width .3s}

/* MODE GRID */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mcard{background:var(--card);border-radius:12px;padding:16px 13px;border:1.5px solid var(--bd);cursor:pointer;transition:border-color .15s}
.mcard:hover{border-color:var(--ink2)}
.mcard .ico{font-size:26px;margin-bottom:6px}
.mcard .ttl{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px}
.mcard .dsc{font-size:11px;color:var(--soft);line-height:1.5}

/* SEC HEAD */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.st{font-size:16px;font-weight:700;color:var(--ink)}
.bk{background:none;border:1.5px solid var(--bd);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--soft);cursor:pointer}
.bk:hover{border-color:var(--ink);color:var(--ink)}

/* FLASH CARD */
.fcwrap{perspective:1000px;cursor:pointer;margin:0 auto 14px;max-width:400px;height:200px}
.fc{width:100%;height:200px;position:relative;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.4,0,.2,1)}
.fc.flipped{transform:rotateY(180deg)}
.fcface{position:absolute;width:100%;height:200px;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px}
.fcf{background:var(--ink);color:#fff;box-shadow:0 4px 18px rgba(30,58,95,.15)}
.fcb{background:var(--card);transform:rotateY(180deg);border:2px solid var(--bd);box-shadow:0 4px 18px rgba(0,0,0,.06)}
.fcw{font-size:36px;font-weight:700;text-align:center;font-family:'Noto Sans KR',system-ui,sans-serif;margin-bottom:8px}
.fch{font-size:12px;opacity:.5}
.fcm{font-size:22px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:6px}
.fctag{font-size:11px;color:var(--soft);background:var(--bg);padding:2px 9px;border-radius:20px}
.fcu{font-size:11px;color:var(--teal);margin-top:8px}
.fcctrl{display:flex;gap:9px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.fcbtn{padding:10px 18px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.fcbtn.know{background:var(--lime);color:#fff}
.fcbtn.no{background:#f0eee9;color:var(--tx);border:1.5px solid var(--bd)}
.fcbtn.skip{background:transparent;border:1.5px solid var(--bd);color:var(--soft)}

/* WRONG LIST */
.wrong-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin:10px 0 14px}
.wchip{background:var(--bg);border:1.5px solid #f5c5c5;border-radius:8px;padding:8px 10px;text-align:center}
.wchip .kr{font-size:14px;font-weight:700;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink)}
.wchip .cn{font-size:10px;color:var(--soft);margin-top:2px}
.wrong-rows{display:flex;flex-direction:column;gap:6px;margin:10px 0 14px}
.wrow{background:var(--bg);border:1.5px solid #f5c5c5;border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:10px}
.wrow .kr{font-size:15px;font-weight:700;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);min-width:100px}
.wrow .cn{font-size:12px;color:var(--soft);flex:1}

/* DONE SCREEN */
.done{text-align:center;padding:28px 12px}
.done .big{font-size:48px;margin-bottom:10px}
.done h3{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:6px}
.done p{font-size:13px;color:var(--soft);margin-bottom:16px;line-height:1.6}

/* BUTTONS */
.btnp{background:var(--ink);color:#fff;border:none;padding:11px 22px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;display:inline-block}
.btnp:hover{background:var(--ink2)}
.btnp.red{background:var(--rose)}
.btnp.full{width:100%;display:block;margin-bottom:8px}
.btng{background:transparent;border:1.5px solid var(--bd);color:var(--soft);padding:11px 16px;border-radius:9px;font-size:13px;cursor:pointer}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* SPELL */
.spprompt{font-size:26px;font-weight:700;color:var(--ink);text-align:center;margin:10px 0 3px}
.spsub{font-size:12px;color:var(--soft);text-align:center;margin-bottom:14px}
.spinp{width:100%;padding:13px;font-size:21px;border:2px solid var(--bd);border-radius:11px;text-align:center;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--card);color:var(--ink);outline:none;transition:border-color .18s}
.spinp:focus{border-color:var(--ink2)}
.spinp.ok{border-color:var(--teal);background:#edfaf6}
.spinp.err{border-color:var(--rose);background:#fdf2f2}
.spfb{text-align:center;font-size:14px;font-weight:600;min-height:22px;margin:8px 0 3px}
.spfb.ok{color:var(--teal)} .spfb.err{color:var(--rose)}
.ansbox{border-radius:9px;padding:10px 14px;text-align:center;margin:4px 0 10px;min-height:58px}
.ansbox.ok{background:#edfaf6;border:1.5px solid var(--teal)}
.ansbox.err{background:#fdf2f2;border:1.5px solid var(--rose)}
.ansbox .lbl{font-size:11px;margin-bottom:3px}
.ansbox .lbl.ok{color:var(--teal)} .ansbox .lbl.err{color:var(--rose)}
.ansbox .word{font-size:22px;font-weight:700;font-family:'Noto Sans KR',system-ui,sans-serif}
.ansbox .word.ok{color:var(--teal)} .ansbox .word.err{color:var(--rose)}
.ansbox .yours{font-size:12px;color:var(--soft);margin-top:4px}

/* MCQ */
.dirrow{display:flex;gap:7px;margin-bottom:11px}
.dirbtn{flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--bd);font-size:12.5px;font-weight:600;cursor:pointer;background:var(--card);color:var(--soft);transition:all .15s}
.dirbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.qbox{background:var(--ink);color:#fff;border-radius:14px;padding:26px 16px;text-align:center;margin-bottom:12px;min-height:106px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.qtext{font-size:28px;font-weight:700;font-family:'Noto Sans KR',system-ui,sans-serif;word-break:break-all}
.qunit{font-size:11px;color:rgba(255,255,255,.4)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:13px 8px;font-size:14px;cursor:pointer;text-align:center;font-family:'Noto Sans KR',system-ui,sans-serif;font-weight:500;word-break:break-all;line-height:1.4;transition:all .12s}
.opt:hover:not([disabled]){border-color:var(--ink2);background:#eef4ff}
.opt.ok{border-color:var(--teal)!important;background:#edfaf6!important;color:var(--teal)!important}
.opt.err{border-color:var(--rose)!important;background:#fdf2f2!important;color:var(--rose)!important}
.opt[disabled]{cursor:default}
.scoreln{text-align:center;font-size:13px;color:var(--soft);margin-bottom:10px}

/* RELATIONS */
.rtabs{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}

<script>
// ===== UTILS =====
const $=id=>document.getElementById(id);
const app=()=>$('app');
function H(h){app().innerHTML=h;}
function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=~~(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a,n){return shuf(a).slice(0,n);}
function posL(p){return p==='동사'?'动词':p==='형용사'?'形容词':'名词';}

// ===== NAV =====
function go(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  (el||document.querySelector('[data-t="'+tab+'"]')).classList.add('on');
  ({home:homeRender,flash:flashTab,mcq:mcqRender,spell:spellTab,
    fill:fillStart,rel:relRender,init:initRender,unit:unitRender})[tab]();
}

// ===== HOME =====
function homeRender(){
  const byU=[1,2,3,4,5].map(u=>VOCAB.filter(v=>v.u===u).length);
  H('<div class="pills">'+
    '<div class="pill"><div class="n">'+VOCAB.length+'</div><div class="l">总单词</div></div>'+
    '<div class="pill"><div class="n">5</div><div class="l">单元</div></div>'+
    '<div class="pill"><div class="n">'+(ANTONYMS.length+SYNONYMS.length)+'</div><div class="l">近反义词组</div></div>'+

    byU.map((n,i)=>'<div style="flex:1;min-width:48px;background:var(--card);border:1.5px solid var(--bd);border-radius:8px;padding:6px;text-align:center"><div style="font-size:15px;font-weight:700;color:var(--ink)">'+n+'</div><div style="font-size:10px;color:var(--soft)">单元'+(i+1)+'</div></div>').join('')+
    '</div>'+
    '<div class="mgrid">'+
    [['flash','🃏','闪卡记忆','翻转查看·错题可回练'],

    '</div>');

function fcCard(){
  if(fcI>=fcQ.length){
    var whtml='';
    if(fcWrong.length===0){
      whtml='<p style="color:var(--teal);font-weight:600;margin:8px 0 16px">🎊 全部认识，没有错题！</p>';
    } else {
      whtml='<div style="font-size:12px;color:var(--soft);font-weight:600;margin:12px 0 8px;text-align:center">❌ 不认识的词（'+fcWrong.length+'个）</div>'+
        '<div class="wrong-list">'+fcWrong.map(function(w){return '<div class="wchip"><div class="kr">'+w.k+'</div><div class="cn">'+w.c+'</div></div>';}).join('')+'</div>'+
        '<button class="btnp red full" onclick="flashStart(fcWrong)">🔁 只练不认识的词（'+fcWrong.length+'个）</button>';
    }
    $('fcA').innerHTML='<div class="done"><div class="big">🎉</div><h3>全部完成！</h3><p>认识 '+fcKn+' 个 · 不认识 '+fcNo+' 个</p>'+whtml+'<button class="btng" onclick="flashStart()">重新开始（全部）</button></div>';
    return;
  }
  var w=fcQ[fcI]; fcFlip=false;
  $('fcA').innerHTML=
    '<div class="fcwrap" id="fcWrap">'+
      '<div class="fc" id="fc">'+
        '<div class="fcface fcf"><div class="fcw">'+w.k+'</div><div class="fch">点击卡片查看中文</div><div class="fcu">单元 '+w.u+'</div></div>'+
        '<div class="fcface fcb"><div class="fcm">'+w.c+'</div><div class="fctag">'+posL(w.p)+'</div><div class="fcu">单元 '+w.u+'</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="fcctrl">'+
      '<button class="fcbtn know" id="btnKnow">✅ 认识</button>'+
      '<button class="fcbtn skip" id="btnSkip">⏭ 跳过</button>'+
      '<button class="fcbtn no" id="btnNo">❌ 不认识</button>'+
    '</div>';
  // 用addEventListener绑定，避免iOS onclick问题
  var wrap=$('fcWrap');
  if(wrap){
    wrap.addEventListener('click',function(e){
      // 只有点卡片本身才翻转，不响应按钮
      fcFlipFn();
    });
  }
  var bk=$('btnKnow'); if(bk) bk.addEventListener('click',function(e){e.stopPropagation();fcMark(true);});
  var bs=$('btnSkip'); if(bs) bs.addEventListener('click',function(e){e.stopPropagation();fcSkip();});
  var bn=$('btnNo');   if(bn) bn.addEventListener('click',function(e){e.stopPropagation();fcMark(false);});
  fcUpdStats();
}

function fcFlipFn(){fcFlip=!fcFlip;var el=$('fc');if(el)el.className='fc'+(fcFlip?' flipped':'');}
function fcMark(ok){
  if(!ok) fcWrong.push(fcQ[fcI]);
  if(ok)fcKn++;else fcNo++;
  fcI++;fcCard();fcUpdStats();
}
function fcSkip(){fcI++;fcCard();fcUpdStats();}
function fcUpdStats(){
  if(!$('fK'))return;
  $('fK').textContent=fcKn;
  $('fN').textContent=fcNo;
  $('fL').textContent=fcQ.length-fcI;
  $('fP').style.width=(fcQ.length?fcI/fcQ.length*100:0)+'%';
  $('fStat').textContent=fcI+'/'+fcQ.length;
  // 同步更新错题pill视觉状态
  var pill=$('fNpill');
  if(pill){
    pill.style.borderColor=fcWrong.length>0?'var(--rose)':'var(--bd)';
    pill.style.cursor=fcWrong.length>0?'pointer':'default';
    var lbl=pill.querySelector('.l');
    if(lbl) lbl.innerHTML='❌ 不认识'+(fcWrong.length>0?' <span style="font-size:9px;color:var(--rose);display:block">(点击查看)</span>':'');

    if(n) n.style.color=fcWrong.length>0?'var(--rose)':'var(--ink)';
  }
}

var mQ=[],mI=0,mOk=0,mErr=0,mDir='kr2cn';
function mcqRender(){
  H('<div class="sh"><div class="st">📝 选择测试</div><button class="bk" onclick="mcqStart()">重新开始</button></div>'+
    '<div class="dirrow">'+
    '<button class="dirbtn'+(mDir==='kr2cn'?' on':'')+'" onclick="mcqDir(\'kr2cn\')">韩 → 中</button>'+

    '<div class="scoreln" id="mScore">正确 '+mOk+' / '+mI+' 题</div>'+
    '<div id="mA"></div>');
  if(!mQ.length)mcqStart();else mcqCard();
}
function mcqStart(){mQ=shuf([...VOCAB]);mI=0;mOk=0;mErr=0;mcqCard();}
function mcqDir(d){
  mDir=d;
  document.querySelectorAll('.dirbtn').forEach(function(b){
    b.className='dirbtn'+(b.textContent.trim()===(d==='kr2cn'?'韩 → 中':'中 → 韩')?' on':'');
  });
}
function mcqCard(){
  if(!$('mA'))return;
  if(mI>=mQ.length){
    $('mA').innerHTML='<div class="done"><div class="big">🏆</div><h3>测试完成！</h3><p>正确 '+mOk+' 题 · 错误 '+mErr+' 题<br>正确率 '+Math.round(mOk/(mQ.length||1)*100)+'%</p><button class="btnp" onclick="mcqStart()">再来一遍</button></div>';
    return;
  }
  var w=mQ[mI];
  var pool=VOCAB.filter(function(v){return v.k!==w.k&&v.p===w.p;});
  var d3=pick(pool.length>=3?pool:VOCAB.filter(function(v){return v.k!==w.k;}),3);
  var opts=shuf([w].concat(d3));
  var ci=opts.indexOf(w);
  var qText=mDir==='kr2cn'?w.k:w.c;
  if($('mScore'))$('mScore').textContent='正确 '+mOk+' / '+mI+' 题';
  $('mA').innerHTML=
    '<div class="qbox"><div class="qtext">'+qText+'</div><div class="qunit">单元 '+w.u+'</div></div>'+
    '<div class="opts">'+opts.map(function(o,i){
      var label=mDir==='kr2cn'?o.c:o.k;
      var isC=i===ci?'1':'0';
      return '<button class="opt" data-c="'+isC+'" onclick="mcqAns(this,'+isC+')">'+label+'</button>';
    }).join('')+'</div><div style="height:10px"></div>';
}
function mcqAns(el,ok){
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;b.onclick=null;});
  el.className='opt '+(ok?'ok':'err');
  if(!ok)document.querySelectorAll('.opt[data-c="1"]').forEach(function(b){b.className='opt ok';});
  if(ok)mOk++;else mErr++;mI++;
  if($('mScore'))$('mScore').textContent='正确 '+mOk+' / '+mI+' 题';
  setTimeout(mcqCard,ok?500:1200);
}

function spCard(){
  if(sI>=sQ.length){
    var whtml='';
    if(sWrong.length===0){
      whtml='<p style="color:var(--teal);font-weight:600;margin:8px 0 16px">🎊 全对，没有错题！</p>';
    } else {
      whtml='<div style="font-size:12px;color:var(--soft);font-weight:600;margin:12px 0 8px;text-align:center">❌ 拼写错误的词（'+sWrong.length+'个）</div>'+
        '<div class="wrong-rows">'+sWrong.map(function(w){return '<div class="wrow"><div class="kr">'+w.k+'</div><div class="cn">'+w.c+'</div><div class="pos" style="font-size:10px;background:var(--bg);color:var(--soft);padding:2px 7px;border-radius:10px">'+posL(w.p)+'</div></div>';}).join('')+'</div>'+
        '<button class="btnp red full" onclick="spellStart(sWrong)">🔁 只练拼写错误的词（'+sWrong.length+'个）</button>';
    }
    $('sA').innerHTML='<div class="done"><div class="big">🎉</div><h3>全部完成！</h3><p>正确 '+sOk+' 个 · 错误 '+sErr+' 个</p>'+whtml+'<button class="btng" onclick="spellStart()">重新开始（全部）</button></div>';
    return;
  }
  sAnswered=false;
  var w=sQ[sI];
  $('sA').innerHTML=
    '<div class="spprompt">'+w.c+'</div>'+
    '<div class="spsub">'+posL(w.p)+' · 单元'+w.u+'</div>'+

    '<button class="btnp" id="sBtn" onclick="spSub()">确认</button>'+
    '<button class="btng" onclick="spSkip()">跳过</button>'+
    '</div>';
  $('sIn').focus();
  $('sIn').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();spSub();}});

function spSub(){
  if(sAnswered){sI++;sAnswered=false;spCard();return;}
  var inp=$('sIn');
  if(!inp)return;
  var w=sQ[sI],val=inp.value.trim();
  if(!val)return;
  sAnswered=true;
  var ok=val===w.k;
  inp.className='spinp '+(ok?'ok':'err');
  $('sFb').textContent=ok?'✅ 正确！':'❌ 拼写有误';
  $('sFb').className='spfb '+(ok?'ok':'err');
  $('sAnsBox').className='ansbox '+(ok?'ok':'err');

    (!ok?'<div class="yours">你输入了：<span style="color:var(--rose)">'+val+'</span></div>':'');
  $('sBtn').textContent='下一个 →';
  if(!ok)sWrong.push(w);
  if(ok)sOk++;else sErr++;
  spUpdStats();
}
function spSkip(){sI++;sAnswered=false;spCard();}
function spUpdStats(){
  if(!$('sOkN'))return;
  $('sOkN').textContent=sOk;$('sErrN').textContent=sErr;

    pill.style.borderColor=sWrong.length>0?'var(--rose)':'var(--bd)';
    pill.style.cursor=sWrong.length>0?'pointer':'default';
    var lbl=pill.querySelector('.l');
    if(lbl) lbl.innerHTML='❌ 错误'+(sWrong.length>0?' <span style="font-size:9px;color:var(--rose);display:block">(点击查看)</span>':'');
    var n=pill.querySelector('.n');
    if(n) n.style.color=sWrong.length>0?'var(--rose)':'var(--ink)';
  }
}

function relMode(m){rMode=m;relRender();}
function relList(){
  var q=($('rQ')&&$('rQ').value)||'';

  if(rMode==='fam'){
    var fams=q?FAMILIES.filter(function(f){return f.members.some(function(w){return w.k.includes(q)||w.c.includes(q);});}):FAMILIES;
    $('rL').innerHTML=fams.length?fams.map(function(f){return '<div class="famcard"><div class="famroot">词根 · '+f.root+'</div><div class="fammembers">'+f.members.map(function(w){return '<div class="famw"><div class="kr">'+w.k+'</div><div class="cn">'+w.c+'</div></div>';}).join('')+'</div></div>';}).join(''):'<div style="text-align:center;color:var(--soft);padding:28px">未找到</div>';
    return;
  }
  var data=rMode==='ant'?ANTONYMS:SYNONYMS;
  var sep=rMode==='ant'?'↔':'≈';
  var sc=rMode==='ant'?'ant':'syn';
  var filtered=q?data.filter(function(g){return g.some(function(w){return w.k.includes(q)||w.c.includes(q);});}):data;
  $('rL').innerHTML=filtered.length?'<div class="rellist">'+filtered.map(function(g){return '<div class="relcard">'+g.map(function(w,i){return (i?'<div class="relsep '+sc+'">'+sep+'</div>':'')+'<div class="relw"><div class="kr">'+w.k+'</div><div class="cn">'+w.c+'</div></div>';}).join('')+'</div>';}).join('')+'</div>':'<div style="text-align:center;color:var(--soft);padding:28px">未找到</div>';
}

// ===== INITIALS =====
var iLet=null;
function initRender(){
  var lets=Object.keys(INITIALS).sort();
  H('<div class="sh"><div class="st">🔤 首字母汇总</div></div>'+
    '<input class="sinp" id="iQ" placeholder="搜索单词…" oninput="iSearch()">'+
    '<div class="letgrid">'+lets.map(function(l){return '<button class="letbtn'+(iLet===l?' on':'')+'" onclick="pickL(\''+l+'\')">'+l+'</button>';}).join('')+'</div>'+
    '<div id="iW">'+(iLet?iWords(iLet):'<div style="text-align:center;color:var(--soft);padding:14px">点击字母查看单词</div>')+'</div>');
}
function iWords(l){
  var ws=INITIALS[l]||[];
  return '<div style="font-size:11px;color:var(--soft);margin-bottom:8px">「'+l+'」开头共 '+ws.length+' 个单词</div>'+
    '<div class="wgrid">'+ws.map(function(w){return '<div class="wchip2"><div class="kr">'+w.k+'</div><div class="cn">'+w.c+'</div></div>';}).join('')+'</div>';
}
function pickL(l){iLet=iLet===l?null:l;initRender();}
function iSearch(){
  var q=($('iQ')&&$('iQ').value)||'';q=q.trim();
  if(!q){$('iW').innerHTML=iLet?iWords(iLet):'<div style="text-align:center;color:var(--soft);padding:14px">点击字母查看</div>';return;}
  var res=[];
  Object.values(INITIALS).forEach(function(ws){ws.forEach(function(w){if(w.k.includes(q)||w.c.includes(q))res.push(w);});});
  $('iW').innerHTML=res.length?'<div style="font-size:11px;color:var(--soft);margin-bottom:8px">找到 '+res.length+' 个</div><div class="wgrid">'+res.map(function(w){return '<div class="wchip2"><div class="kr">'+w.k+'</div><div class="cn">'+w.c+'</div></div>';}).join('')+'</div>':'<div style="text-align:center;color:var(--soft);padding:14px">未找到</div>';
}

// ===== UNIT BROWSER =====
var uTab=97;
function unitRender(){
  H('<div class="sh"><div class="st">📚 单元浏览</div></div>'+
    '<div class="utabs">'+[97].map(function(u){return '<button class="utab'+(uTab===u?' on':'')+'" onclick="setUT('+u+')">单元'+u+' <span style="font-size:10px;opacity:.7">('+VOCAB.filter(function(v){return v.u===u;}).length+')</span></button>';}).join('')+'</div>'+
    '<div id="uL"></div>');
  uList();
}
function setUT(u){uTab=u;document.querySelectorAll('.utab').forEach(function(b,i){b.className='utab'+(97===u?' on':'');});uList();}
function uList(){
  if(!$('uL'))return;
  var words=VOCAB.filter(function(v){return v.u===uTab;});
  $('uL').innerHTML='<div class="ulist">'+words.map(function(w){return '<div class="urow"><div class="kr">'+w.k+'</div><div class="cn">'+w.c+'</div><div class="pos">'+posL(w.p)+'</div></div>';}).join('')+'</div>';
}

// ===== INIT =====
homeRender();
</script>
